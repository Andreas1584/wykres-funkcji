<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Wykres funkcji kwadratowej</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 20px auto;
      padding: 10px;
      background: #f5f5f5;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 15px;
      align-items: center;
    }
    input {
      width: 70px;
      padding: 6px;
      font-size: 16px;
    }
    button {
      padding: 8px 18px;
      font-size: 16px;
      cursor: pointer;
      background: #2c7a2c;
      color: white;
      border: none;
      border-radius: 5px;
    }
    button:hover {
      background: #1e5a1e;
    }
    canvas {
      background: white;
      border: 1px solid #ccc;
      display: block;
      width: 100%;
      max-width: 850px;
    }
  </style>
</head>
<body>

  <h2>Wykres funkcji kwadratowej y = ax² + bx + c</h2>

  <div class="controls">
    <label>a: <input type="number" id="a" value="1" step="0.1"></label>
    <label>b: <input type="number" id="b" value="0" step="0.1"></label>
    <label>c: <input type="number" id="c" value="-4" step="0.1"></label>
    <label>X min: <input type="number" id="xmin" value="-10" step="1"></label>
    <label>X max: <input type="number" id="xmax" value="10" step="1"></label>
    <button onclick="rysuj()">Rysuj</button>
  </div>

  <canvas id="canvas" width="850" height="500"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function rysuj() {
      const a = parseFloat(document.getElementById('a').value);
      const b = parseFloat(document.getElementById('b').value);
      const c = parseFloat(document.getElementById('c').value);
      const xMin = parseFloat(document.getElementById('xmin').value);
      const xMax = parseFloat(document.getElementById('xmax').value);

      const szer = canvas.width;
      const wys = canvas.height;

      // Czyszczenie
      ctx.fillStyle = 'white';
      ctx.fillRect(0, 0, szer, wys);

      // Obliczenie zakresu Y
      let yMin = Infinity;
      let yMax = -Infinity;

      for (let i = 0; i < szer; i++) {
        const x = xMin + (i / (szer - 1)) * (xMax - xMin);
        const y = a * x * x + b * x + c;
        if (y < yMin) yMin = y;
        if (y > yMax) yMax = y;
      }

      // Zapas
      const zapas = (yMax - yMin) * 0.12 || 1;
      yMin -= zapas;
      yMax += zapas;

      // Funkcje zamiany współrzędnych
      function toX(x) {
        return (x - xMin) / (xMax - xMin) * (szer - 1);
      }
      function toY(y) {
        return (yMax - y) / (yMax - yMin) * (wys - 1);
      }

      // Siatka
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 10; i++) {
        const x = i / 10 * szer;
        const y = i / 10 * wys;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, wys);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(szer, y);
        ctx.stroke();
      }

      // Osie
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 2;

      // Oś X
      const y0 = toY(0);
      ctx.beginPath();
      ctx.moveTo(0, y0);
      ctx.lineTo(szer, y0);
      ctx.stroke();

      // Oś Y
      const x0 = toX(0);
      ctx.beginPath();
      ctx.moveTo(x0, 0);
      ctx.lineTo(x0, wys);
      ctx.stroke();

      // Funkcja
      ctx.strokeStyle = 'red';
      ctx.lineWidth = 3;
      ctx.beginPath();

      for (let i = 0; i < szer; i++) {
        const x = xMin + (i / (szer - 1)) * (xMax - xMin);
        const y = a * x * x + b * x + c;
        const px = i;
        const py = toY(y);

        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.stroke();

      // Podpisy (proste)
      ctx.fillStyle = '#333';
      ctx.font = '12px Arial';
      ctx.fillText(xMin.toFixed(1), 5, y0 - 5);
      ctx.fillText(xMax.toFixed(1), szer - 40, y0 - 5);
      ctx.fillText(yMax.toFixed(1), x0 + 5, 15);
      ctx.fillText(yMin.toFixed(1), x0 + 5, wys - 5);
    }

    // Rysuj od razu po załadowaniu
    rysuj();
  </script>
</body>
</html>
